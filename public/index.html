<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenAI API Parameter Lab</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <aside class="settings-panel">
        <div class="brand-row">
          <div>
            <p class="eyebrow">OpenAI API</p>
            <h1>Parameter Lab</h1>
          </div>
          <div class="top-actions">
            <a class="ghost-link" href="/memory_chat">Memory Agent</a>
            <a class="ghost-link" href="/chat">Classic Chat</a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему" title="Переключить тему">
              <span id="themeIcon">☾</span>
            </button>
            <span class="status-pill" id="statusPill">готов</span>
          </div>
        </div>

        <form id="settingsForm" class="settings-form">
          <section class="control-group">
            <label for="apiKey">API key</label>
            <input id="apiKey" name="apiKey" type="password" autocomplete="off" placeholder="sk-..." spellcheck="false">
          </section>

          <section class="control-group">
            <label for="model">Модель</label>
            <select id="model" name="model">
              <optgroup label="Frontier">
                <option value="gpt-5.4">gpt-5.4</option>
                <option value="gpt-5.4-mini">gpt-5.4-mini</option>
                <option value="gpt-5.4-nano">gpt-5.4-nano</option>
              </optgroup>
              <optgroup label="GPT-5 family">
                <option value="gpt-5.5">gpt-5.5</option>
                <option value="gpt-5.2">gpt-5.2</option>
                <option value="gpt-5.2-pro">gpt-5.2-pro</option>
                <option value="gpt-5.2-chat-latest">gpt-5.2-chat-latest</option>
                <option value="gpt-5.2-codex">gpt-5.2-codex</option>
                <option value="gpt-5.1">gpt-5.1</option>
                <option value="gpt-5.1-chat-latest">gpt-5.1-chat-latest</option>
                <option value="gpt-5.1-codex">gpt-5.1-codex</option>
                <option value="gpt-5.1-codex-max">gpt-5.1-codex-max</option>
                <option value="gpt-5">gpt-5</option>
                <option value="gpt-5-mini">gpt-5-mini</option>
                <option value="gpt-5-nano">gpt-5-nano</option>
                <option value="gpt-5-pro">gpt-5-pro</option>
                <option value="gpt-5-chat-latest">gpt-5-chat-latest</option>
                <option value="gpt-5-codex">gpt-5-codex</option>
              </optgroup>
              <optgroup label="GPT-4 family">
                <option value="gpt-4.1">gpt-4.1</option>
                <option value="gpt-4.1-mini">gpt-4.1-mini</option>
                <option value="gpt-4.1-nano">gpt-4.1-nano</option>
                <option value="gpt-4o">gpt-4o</option>
                <option value="gpt-4o-mini">gpt-4o-mini</option>
              </optgroup>
              <optgroup label="Reasoning">
                <option value="o3">o3</option>
                <option value="o3-mini">o3-mini</option>
                <option value="o3-pro">o3-pro</option>
                <option value="o4-mini">o4-mini</option>
              </optgroup>
              <option value="custom">custom</option>
            </select>
            <input id="customModel" class="hidden" name="customModel" type="text" placeholder="model-id" spellcheck="false">
            <p class="field-note" id="modelSupportHint"></p>
          </section>

          <section class="control-group">
            <label for="instructions">Instructions</label>
            <textarea id="instructions" name="instructions" rows="3" placeholder="Системная инструкция"></textarea>
          </section>

          <section class="experts-panel" aria-labelledby="expertsTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Experts</p>
                <h2 id="expertsTitle">Группа экспертов</h2>
              </div>
              <button class="ghost-button compact" id="addExpert" type="button">Добавить</button>
            </div>
            <label class="switch-row" for="useExperts">
              <input id="useExperts" name="useExperts" type="checkbox">
              <span>Использовать в запросе</span>
            </label>
            <div class="expert-list" id="expertList"></div>
          </section>

          <section class="control-group">
            <label for="prompt">Prompt</label>
            <textarea id="prompt" name="prompt" rows="5" placeholder="Запрос для модели">Сравни температуру 0.2 и 1.0 на примере короткой идеи для стартапа.</textarea>
          </section>

          <section class="parameter-grid">
            <label class="parameter-card" for="temperature" data-param-card="temperature">
              <span>temperature</span>
              <input id="temperature" name="temperature" type="number" min="0" max="2" step="0.01" placeholder="не отправлять">
              <small id="temperatureNote"></small>
            </label>

            <label class="parameter-card" for="topP" data-param-card="top_p">
              <span>top_p</span>
              <input id="topP" name="topP" type="number" min="0" max="1" step="0.01" placeholder="не отправлять">
              <small id="topPNote"></small>
            </label>

            <label class="parameter-card" for="presencePenalty" data-param-card="presence_penalty">
              <span>presence_penalty</span>
              <input id="presencePenalty" name="presencePenalty" type="number" min="-2" max="2" step="0.01" placeholder="не поддерживается">
              <small id="presencePenaltyNote"></small>
            </label>

            <label class="parameter-card" for="frequencyPenalty" data-param-card="frequency_penalty">
              <span>frequency_penalty</span>
              <input id="frequencyPenalty" name="frequencyPenalty" type="number" min="-2" max="2" step="0.01" placeholder="не поддерживается">
              <small id="frequencyPenaltyNote"></small>
            </label>
          </section>

          <section class="number-grid">
            <label for="maxOutputTokens">
              <span>max_output_tokens</span>
              <input id="maxOutputTokens" name="maxOutputTokens" type="number" min="1" max="20000" step="1" placeholder="не отправлять">
            </label>

            <label for="textVerbosity">
              <span>text.verbosity</span>
              <select id="textVerbosity" name="textVerbosity">
                <option value="">не отправлять</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
              </select>
            </label>

            <label for="topK">
              <span>top_k</span>
              <input id="topK" name="topK" type="number" min="1" step="1" placeholder="не поддерживается" disabled>
            </label>

            <label for="topV">
              <span>top_v</span>
              <input id="topV" name="topV" type="number" min="0" step="0.01" placeholder="не поддерживается" disabled>
            </label>
          </section>

          <section class="control-group">
            <label for="reasoningEffort">reasoning.effort</label>
            <select id="reasoningEffort" name="reasoningEffort">
              <option value="">не отправлять</option>
              <option value="none">none</option>
              <option value="minimal">minimal</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="xhigh">xhigh</option>
            </select>
            <p class="field-note" id="reasoningHint"></p>
          </section>

          <section class="control-group">
            <label for="extraJson">Extra JSON</label>
            <textarea id="extraJson" name="extraJson" rows="4" spellcheck="false" placeholder='{"metadata":{"test":"a"}}'></textarea>
          </section>

          <div class="button-row">
            <button class="primary-button" id="sendButton" type="submit">Запустить</button>
            <button class="ghost-button" id="resetButton" type="button">Сброс</button>
          </div>
        </form>
      </aside>

      <section class="workspace">
        <section class="metrics-strip" aria-label="Метрики запроса">
          <div class="metric-card">
            <span>Время</span>
            <strong id="metricLatency">-</strong>
          </div>
          <div class="metric-card">
            <span>Input tokens</span>
            <strong id="metricInputTokens">-</strong>
          </div>
          <div class="metric-card">
            <span>Output tokens</span>
            <strong id="metricOutputTokens">-</strong>
          </div>
          <div class="metric-card">
            <span>Total tokens</span>
            <strong id="metricTotalTokens">-</strong>
          </div>
          <div class="metric-card wide">
            <span>Стоимость</span>
            <strong id="metricCost">-</strong>
          </div>
        </section>

        <div class="pane-grid">
          <article class="json-pane">
            <header class="pane-header">
              <div>
                <p class="eyebrow">Request</p>
                <h2>JSON запроса</h2>
              </div>
              <button class="icon-button" id="copyRequest" type="button" title="Скопировать request JSON" aria-label="Скопировать request JSON">⧉</button>
            </header>
            <pre id="requestPreview" class="code-block"></pre>
          </article>

          <article class="json-pane">
            <header class="pane-header">
              <div>
                <p class="eyebrow">Response</p>
                <h2>Ответ</h2>
              </div>
              <div class="pane-actions">
                <button class="ghost-button compact" id="toggleParsed" type="button">Текст</button>
                <button class="icon-button" id="copyResponse" type="button" title="Скопировать ответ" aria-label="Скопировать ответ">⧉</button>
              </div>
            </header>
            <pre id="responsePreview" class="code-block muted"></pre>
          </article>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
