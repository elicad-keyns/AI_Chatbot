<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Chat Agent</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="chat-page">
    <main class="chat-shell">
      <header class="chat-topbar">
        <div>
          <p class="eyebrow">Day 6</p>
          <h1>AI Chat Agent</h1>
        </div>
        <nav class="chat-nav" aria-label="Navigation">
          <a class="ghost-link" href="/">Parameter Lab</a>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему" title="Переключить тему">
            <span id="themeIcon">☾</span>
          </button>
        </nav>
      </header>

      <section class="chat-layout">
        <aside class="chat-settings" aria-label="Chat settings">
          <section class="chat-history-panel" aria-labelledby="chatHistoryTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">History</p>
                <h2 id="chatHistoryTitle">Чаты</h2>
              </div>
              <button class="ghost-button compact" id="newChat" type="button">Новый</button>
            </div>
            <div class="chat-list" id="chatList"></div>
          </section>

          <label for="chatModel">
            <span>Модель</span>
            <select id="chatModel" name="chatModel">
              <option value="gpt-4.1-mini">gpt-4.1-mini</option>
              <option value="gpt-4.1">gpt-4.1</option>
              <option value="gpt-4.1-nano">gpt-4.1-nano</option>
              <option value="gpt-4o-mini">gpt-4o-mini</option>
              <option value="gpt-4o">gpt-4o</option>
              <option value="gpt-5-mini">gpt-5-mini</option>
              <option value="gpt-5">gpt-5</option>
              <option value="custom">custom</option>
            </select>
          </label>

          <label id="customModelWrap" class="hidden" for="customModel">
            <span>Custom model</span>
            <input id="customModel" name="customModel" type="text" placeholder="model-id" spellcheck="false">
          </label>

          <label for="chatApiKey">
            <span>API key</span>
            <input id="chatApiKey" name="chatApiKey" type="password" autocomplete="off" placeholder="Railway env или sk-...">
          </label>

          <p class="field-note">Ключ можно не вводить, если на сервере задан OPENAI_API_KEY. История хранится на сервере и восстанавливается после перезапуска.</p>
          <button class="ghost-button" id="clearChat" type="button">Очистить выбранный чат</button>
        </aside>

        <section class="chat-window" aria-label="Chat">
          <div class="chat-status-row">
            <strong class="active-chat-title" id="activeChatTitle">Новый чат</strong>
            <span class="status-pill" id="chatStatus">готов</span>
          </div>
          <div class="message-list" id="messageList" aria-live="polite"></div>
          <form class="chat-composer" id="chatForm">
            <textarea id="chatInput" rows="2" placeholder="Напишите сообщение агенту..." required></textarea>
            <button class="primary-button" id="sendMessage" type="submit">Отправить</button>
          </form>
        </section>
      </section>
    </main>

    <script src="/chat.js"></script>
  </body>
</html>
