<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Chat Agent</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="chat-page">
    <main class="chat-shell">
      <header class="chat-topbar">
        <div>
          <p class="eyebrow">Day 10</p>
          <h1>AI Chat Agent</h1>
        </div>
        <nav class="chat-nav" aria-label="Navigation">
          <span class="user-badge hidden" id="userBadge"></span>
          <button class="ghost-button compact hidden" id="logoutButton" type="button">Выйти</button>
          <a class="ghost-link" href="/">Parameter Lab</a>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему" title="Переключить тему">
            <span id="themeIcon">☾</span>
          </button>
        </nav>
      </header>

      <section class="chat-layout">
        <aside class="chat-settings" aria-label="История чатов">
          <section class="chat-history-panel" aria-labelledby="chatHistoryTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">History</p>
                <h2 id="chatHistoryTitle">Чаты</h2>
              </div>
              <button class="ghost-button compact" id="newChat" type="button">Новый</button>
            </div>
            <div class="chat-list" id="chatList"></div>
          </section>
        </aside>

        <section class="chat-window" aria-label="Chat">
          <div class="chat-status-row">
            <div class="chat-title-block">
              <strong class="active-chat-title" id="activeChatTitle">Новый чат</strong>
              <span class="field-note">Контекст хранится внутри выбранного чата.</span>
            </div>

            <div class="chat-toolbar" aria-label="Настройки чата">
              <label class="toolbar-field" for="chatModel">
                <span>Модель</span>
                <select id="chatModel" name="chatModel">
                  <option value="gpt-4.1-mini">gpt-4.1-mini</option>
                  <option value="gpt-4.1">gpt-4.1</option>
                  <option value="gpt-4.1-nano">gpt-4.1-nano</option>
                  <option value="gpt-4o-mini">gpt-4o-mini</option>
                  <option value="gpt-4o">gpt-4o</option>
                  <option value="gpt-5-mini">gpt-5-mini</option>
                  <option value="gpt-5">gpt-5</option>
                  <option value="custom">custom</option>
                </select>
              </label>

              <label id="customModelWrap" class="toolbar-field hidden" for="customModel">
                <span>Custom</span>
                <input id="customModel" name="customModel" type="text" placeholder="model-id" spellcheck="false">
              </label>

              <label class="toolbar-field strategy-field" for="contextStrategy">
                <span>Стратегия</span>
                <select id="contextStrategy" name="contextStrategy">
                  <option value="sliding">Sliding Window</option>
                  <option value="facts">Sticky Facts</option>
                  <option value="branching">Branching</option>
                </select>
              </label>

              <label class="toolbar-field compact-number-field" for="windowSize">
                <span>Окно</span>
                <input id="windowSize" name="windowSize" type="number" min="2" max="40" step="1" value="8">
              </label>

              <button class="ghost-button compact" id="showFacts" type="button">Facts</button>

              <label class="toolbar-switch" for="compressionToggle">
                <input id="compressionToggle" name="compressionToggle" type="checkbox" checked>
                <span>Компрессия</span>
              </label>

              <label class="toolbar-field compact-number-field" for="compressionBatchSize">
                <span>Порог</span>
                <input id="compressionBatchSize" name="compressionBatchSize" type="number" min="2" max="80" step="1" value="10">
              </label>

              <button class="ghost-button compact" id="showCompression" type="button">Summary</button>

              <label class="toolbar-field branch-field" for="branchSelect">
                <span>Ветка</span>
                <select id="branchSelect" name="branchSelect"></select>
              </label>

              <button class="ghost-button compact" id="saveCheckpoint" type="button">Checkpoint</button>
              <button class="ghost-button compact" id="createBranch" type="button">Branch</button>

              <label class="toolbar-field api-key-field" for="chatApiKey">
                <span>API key</span>
                <input id="chatApiKey" name="chatApiKey" type="password" autocomplete="off" placeholder="OPENAI_API_KEY или sk-...">
              </label>

              <button class="ghost-button compact" id="clearChat" type="button">Очистить</button>
              <span class="status-pill" id="chatStatus">готов</span>
            </div>
          </div>

          <section class="token-panel" aria-label="Token usage">
            <div class="token-card">
              <span>Текущий</span>
              <strong id="metricCurrentTokens">0</strong>
            </div>
            <div class="token-card">
              <span>История</span>
              <strong id="metricHistoryTokens">0</strong>
            </div>
            <div class="token-card">
              <span>В запросе</span>
              <strong id="metricRequestTokens">0</strong>
            </div>
            <div class="token-card">
              <span>Полная</span>
              <strong id="metricFullRequestTokens">0</strong>
            </div>
            <div class="token-card">
              <span>Экономия</span>
              <strong id="metricSavedTokens">0</strong>
            </div>
            <div class="token-card">
              <span>Контекст</span>
              <strong id="metricSummaryTokens">0</strong>
            </div>
            <div class="token-card">
              <span>Ответ</span>
              <strong id="metricResponseTokens">0</strong>
            </div>
            <div class="token-card">
              <span>Лимит</span>
              <strong id="metricTokenLimit">0</strong>
            </div>
            <div class="token-card">
              <span>Стоимость</span>
              <strong id="metricTokenCost">$0.000000</strong>
            </div>
            <p class="token-warning" id="tokenWarning"></p>
          </section>

          <div class="message-list" id="messageList" aria-live="polite"></div>
          <form class="chat-composer" id="chatForm">
            <textarea id="chatInput" rows="2" placeholder="Напишите сообщение агенту..." required></textarea>
            <button class="primary-button" id="sendMessage" type="submit">Отправить</button>
          </form>
        </section>
      </section>
    </main>

    <div class="auth-overlay hidden" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <form class="auth-dialog" id="authForm">
        <div>
          <p class="eyebrow">Account</p>
          <h2 id="authTitle">Вход в чат</h2>
        </div>
        <label for="authLogin">
          <span>Логин</span>
          <input id="authLogin" name="login" type="text" autocomplete="username" required>
        </label>
        <label for="authPassword">
          <span>Пароль</span>
          <input id="authPassword" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="auth-error" id="authError"></p>
        <div class="button-row">
          <button class="primary-button" id="loginButton" type="submit">Войти</button>
          <button class="ghost-button" id="registerButton" type="button">Регистрация</button>
        </div>
      </form>
    </div>

    <div class="summary-overlay hidden" id="summaryOverlay" role="dialog" aria-modal="true" aria-labelledby="summaryTitle">
      <section class="summary-dialog">
        <header class="summary-dialog-head">
          <div>
            <p class="eyebrow">Compression</p>
            <h2 id="summaryTitle">Текущая компрессия</h2>
          </div>
          <button class="icon-button" id="closeSummary" type="button" aria-label="Закрыть">×</button>
        </header>
        <div class="summary-stats" id="summaryStats"></div>
        <pre class="summary-text" id="summaryText"></pre>
      </section>
    </div>

    <script src="/chat.js"></script>
  </body>
</html>
