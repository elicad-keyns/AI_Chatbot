<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Chat Agent</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="chat-page">
    <main class="chat-shell">
      <header class="chat-topbar">
        <div>
          <p class="eyebrow">Day 7</p>
          <h1>AI Chat Agent</h1>
        </div>
        <nav class="chat-nav" aria-label="Navigation">
          <span class="user-badge hidden" id="userBadge"></span>
          <button class="ghost-button compact hidden" id="logoutButton" type="button">Выйти</button>
          <a class="ghost-link" href="/">Parameter Lab</a>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему" title="Переключить тему">
            <span id="themeIcon">☾</span>
          </button>
        </nav>
      </header>

      <section class="chat-layout">
        <aside class="chat-settings" aria-label="История чатов">
          <section class="chat-history-panel" aria-labelledby="chatHistoryTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">History</p>
                <h2 id="chatHistoryTitle">Чаты</h2>
              </div>
              <button class="ghost-button compact" id="newChat" type="button">Новый</button>
            </div>
            <div class="chat-list" id="chatList"></div>
          </section>
        </aside>

        <section class="chat-window" aria-label="Chat">
          <div class="chat-status-row">
            <div class="chat-title-block">
              <strong class="active-chat-title" id="activeChatTitle">Новый чат</strong>
              <span class="field-note">Контекст хранится внутри выбранного чата.</span>
            </div>

            <div class="chat-toolbar" aria-label="Настройки чата">
              <label class="toolbar-field" for="chatModel">
                <span>Модель</span>
                <select id="chatModel" name="chatModel">
                  <option value="gpt-4.1-mini">gpt-4.1-mini</option>
                  <option value="gpt-4.1">gpt-4.1</option>
                  <option value="gpt-4.1-nano">gpt-4.1-nano</option>
                  <option value="gpt-4o-mini">gpt-4o-mini</option>
                  <option value="gpt-4o">gpt-4o</option>
                  <option value="gpt-5-mini">gpt-5-mini</option>
                  <option value="gpt-5">gpt-5</option>
                  <option value="custom">custom</option>
                </select>
              </label>

              <label id="customModelWrap" class="toolbar-field hidden" for="customModel">
                <span>Custom</span>
                <input id="customModel" name="customModel" type="text" placeholder="model-id" spellcheck="false">
              </label>

              <label class="toolbar-field api-key-field" for="chatApiKey">
                <span>API key</span>
                <input id="chatApiKey" name="chatApiKey" type="password" autocomplete="off" placeholder="OPENAI_API_KEY или sk-...">
              </label>

              <button class="ghost-button compact" id="clearChat" type="button">Очистить</button>
              <span class="status-pill" id="chatStatus">готов</span>
            </div>
          </div>

          <div class="message-list" id="messageList" aria-live="polite"></div>
          <form class="chat-composer" id="chatForm">
            <textarea id="chatInput" rows="2" placeholder="Напишите сообщение агенту..." required></textarea>
            <button class="primary-button" id="sendMessage" type="submit">Отправить</button>
          </form>
        </section>
      </section>
    </main>

    <div class="auth-overlay hidden" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <form class="auth-dialog" id="authForm">
        <div>
          <p class="eyebrow">Account</p>
          <h2 id="authTitle">Вход в чат</h2>
        </div>
        <label for="authLogin">
          <span>Логин</span>
          <input id="authLogin" name="login" type="text" autocomplete="username" required>
        </label>
        <label for="authPassword">
          <span>Пароль</span>
          <input id="authPassword" name="password" type="password" autocomplete="current-password" required>
        </label>
        <p class="auth-error" id="authError"></p>
        <div class="button-row">
          <button class="primary-button" id="loginButton" type="submit">Войти</button>
          <button class="ghost-button" id="registerButton" type="button">Регистрация</button>
        </div>
      </form>
    </div>

    <script src="/chat.js"></script>
  </body>
</html>
